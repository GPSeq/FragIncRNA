[general]
index_method = "ibf"

ref_dir = "test_data/genomes/"
query_file = "test_data/query.fasta"

output_dir = "test_data/results"
output_file = "results.tsv"
log_file = "ibf_run.log"

fragment_size = 800
kmer_size = 12
hit_threshold = 1
threads = 1

store_fragments = false
store_index = false
cleanup_index = false
single_results_writer = false

[ibf]
hash_functions = 3
fpr = 0.01
multi_indexing = true

[hibf]
hash_functions = 3
maximum_fpr = 0.01
relaxed_fpr = 0.5
threads = 8
sketch_bits = 12
tmax = 0
empty_bin_fraction = 0.0
alpha = 1.2
max_rearrangement_ratio = 0.5
disable_estimate_union = false
disable_rearrangement = false
