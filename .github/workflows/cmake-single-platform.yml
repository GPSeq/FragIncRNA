name: CMake tests

on:
  push:
    branches: [ "main", "reporting" ]
  pull_request:
    branches: [ "main", "reporting" ]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          rm -rf "${{ github.workspace }}/build"
          python3 scripts/measure_command.py --output ci-metrics/configure.json -- \
          cmake -S "${{ github.workspace }}" \
                -B "${{ github.workspace }}/build" \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DBUILD_TESTING=ON \
                -DLNCRNA_MERS_ENABLE_HIBF=OFF

      - name: Build
        run: python3 scripts/measure_command.py --output ci-metrics/build.json -- cmake --build "${{ github.workspace }}/build" --config ${{ env.BUILD_TYPE }} -j

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: python3 ../scripts/measure_command.py --output ../ci-metrics/test.json -- ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --no-tests=error

      - name: Save resource reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-resource-reports
          path: ci-metrics/*.json
